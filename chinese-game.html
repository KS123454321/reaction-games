<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文文字大挑戰 - 全齡反應訓練</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 啟用 Tailwind 類別深色模式支援
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- 引入 Google Fonts: Noto Serif TC 與 Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        /* 淺色與深色背景點陣紋理 */
        .bg-pattern-light {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .dark .bg-pattern-light {
            background-color: #0f172a;
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .font-serif-tc {
            font-family: 'Noto Serif TC', serif;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(8px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop-in {
            animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.35s ease-in-out;
        }
        @keyframes pulseFast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .animate-pulse-fast {
            animation: pulseFast 0.8s infinite;
        }
    </style>
</head>
<body class="bg-pattern-light min-h-screen flex flex-col items-center justify-between text-slate-800 dark:text-slate-100 p-4 sm:p-6">

    <!-- 頂部全齡遊戲導航列 (含回首頁、深色模式切換、即時計分) -->
    <header class="w-full max-w-3xl flex flex-wrap items-center justify-between gap-3 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md px-4 sm:px-6 py-3.5 rounded-3xl shadow-md border border-slate-200/80 dark:border-slate-700/80 transition-colors">
        
        <!-- 左側：回首頁與遊戲標題 -->
        <div class="flex items-center gap-3">
            <button onclick="saveAndGoHome()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold text-sm transition-all active:scale-95 cursor-pointer shadow-xs" title="儲存分數並返回首頁">
                <i data-lucide="home" class="w-4 h-4"></i>
                <span>首頁</span>
            </button>

            <div class="h-7 w-px bg-slate-200 dark:bg-slate-700 hidden sm:block"></div>

            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-2xl bg-amber-500/15 dark:bg-amber-400/20 text-amber-600 dark:text-amber-300 flex items-center justify-center text-2xl shadow-inner">
                    🀄
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-black text-base sm:text-lg text-slate-900 dark:text-white leading-tight">中文文字大挑戰</h1>
                        <span class="hidden md:inline-block text-[11px] px-2 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 font-bold border border-indigo-200/70 dark:border-indigo-700/50">
                            語文聯想
                        </span>
                    </div>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <span id="pool-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        <span id="pool-count-text" class="text-xs text-slate-500 dark:text-slate-400 font-medium">精選題庫就緒</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：計分、倒數、連勝與深色模式按鈕 -->
        <div class="flex items-center gap-2.5 sm:gap-4 ml-auto sm:ml-0">
            <!-- 限時模式倒數計時器 -->
            <div id="timer-box" class="hidden flex flex-col items-end pr-2.5 border-r border-slate-200 dark:border-slate-700">
                <span class="text-[11px] text-slate-400 font-bold">剩餘時間</span>
                <div id="timer-display" class="font-mono font-black text-xl sm:text-2xl text-amber-600 dark:text-amber-400">60s</div>
            </div>

            <!-- 連勝 -->
            <div class="flex flex-col items-end">
                <span class="text-[11px] text-slate-400 font-bold">連勝</span>
                <div class="flex items-center gap-1 text-amber-600 dark:text-amber-400 font-black text-base sm:text-lg">
                    <i data-lucide="flame" class="w-4 h-4 fill-amber-500"></i>
                    <span id="streak-display">0</span>
                </div>
            </div>

            <div class="h-7 w-px bg-slate-200 dark:bg-slate-700"></div>

            <!-- 得分 -->
            <div class="flex flex-col items-end">
                <span class="text-[11px] text-slate-400 font-bold">本局得分</span>
                <span id="score-display" class="font-black text-xl sm:text-2xl text-indigo-600 dark:text-indigo-400">0</span>
            </div>

            <!-- 深色/淺色模式切換按鈕 -->
            <button onclick="toggleDarkMode()" class="p-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-amber-300 transition-all active:scale-95 cursor-pointer" title="切換深色/淺色模式" aria-label="切換深色模式">
                <i id="theme-icon-sun" data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                <i id="theme-icon-moon" data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
            </button>
        </div>
    </header>

    <!-- 主遊戲區塊 -->
    <main class="w-full max-w-3xl my-auto py-4 flex flex-col items-center">
        
        <!-- 模式與題型控制列 -->
        <div class="w-full flex flex-wrap items-center justify-between gap-2.5 mb-4 px-1">
            <!-- 訓練模式 vs 限時模式 -->
            <div class="inline-flex rounded-2xl bg-slate-200/80 dark:bg-slate-800 p-1 text-xs sm:text-sm font-bold border border-slate-200 dark:border-slate-700">
                <button id="playmode-training" onclick="switchPlayMode('training')" class="px-4 py-2 rounded-xl bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition-all flex items-center gap-1.5 cursor-pointer">
                    <i data-lucide="book-open-check" class="w-4 h-4 text-indigo-600 dark:text-indigo-400"></i>
                    休閒練習
                </button>
                <button id="playmode-timed" onclick="switchPlayMode('timed')" class="px-4 py-2 rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all flex items-center gap-1.5 cursor-pointer">
                    <i data-lucide="timer" class="w-4 h-4 text-rose-500"></i>
                    60秒反應挑戰
                </button>
            </div>

            <!-- 題型篩選 -->
            <select id="category-filter" onchange="handleCategoryChange()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs sm:text-sm font-bold rounded-2xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 shadow-sm cursor-pointer">
                <option value="ALL">綜合題型（單字/語詞/成語）</option>
                <option value="字音">專攻：字音（破音/多音字）</option>
                <option value="字形">專攻：字形（易錯別字）</option>
                <option value="部首">專攻：部首（難檢字部首）</option>
            </select>
        </div>

        <!-- 題目卡片容器 -->
        <div id="question-card" class="w-full bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-200/90 dark:border-slate-700/90 p-6 sm:p-10 relative overflow-hidden transition-colors duration-200 min-h-[340px] flex flex-col justify-between">
            
            <!-- 限時模式：開始前準備畫面遮罩 -->
            <div id="timed-start-overlay" class="hidden absolute inset-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-6 sm:p-8 text-center animate-pop-in">
                <div class="w-16 h-16 rounded-2xl bg-rose-100 dark:bg-rose-900/40 text-rose-600 dark:text-rose-400 flex items-center justify-center mb-4 shadow-inner">
                    <i data-lucide="zap" class="w-8 h-8"></i>
                </div>
                <h2 class="font-black text-2xl sm:text-3xl text-slate-900 dark:text-white mb-2">60 秒語文反應挑戰</h2>
                <p class="text-sm sm:text-base text-slate-600 dark:text-slate-300 max-w-md mb-6 leading-relaxed">
                    答題後自動秒切下一題！<br>
                    考驗你對<span class="font-bold text-indigo-600 dark:text-indigo-400">破音字、易錯字形與部首</span>的直覺反應。
                </p>
                <button onclick="startTimedGame()" class="px-8 py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-black text-lg sm:text-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center gap-2 cursor-pointer">
                    <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                    <span>開始計時挑戰</span>
                </button>
            </div>

            <!-- 限時模式：時間到結算畫面遮罩 -->
            <div id="timed-result-overlay" class="hidden absolute inset-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-6 sm:p-8 text-center animate-pop-in">
                <div class="w-16 h-16 rounded-2xl bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 flex items-center justify-center mb-3 shadow-inner">
                    <i data-lucide="trophy" class="w-8 h-8"></i>
                </div>
                <h2 class="font-black text-2xl sm:text-3xl text-slate-900 dark:text-white mb-1">時間到！挑戰結束</h2>
                <p id="result-comment" class="text-sm sm:text-base text-slate-500 dark:text-slate-400 mb-5">表現相當亮眼！</p>
                
                <div class="grid grid-cols-3 gap-3 w-full max-w-md mb-6">
                    <div class="bg-slate-50 dark:bg-slate-700/60 border border-slate-200/80 dark:border-slate-600 rounded-2xl p-3">
                        <div class="text-xs text-slate-400 font-bold">本局得分</div>
                        <div id="final-score" class="font-black text-2xl text-indigo-600 dark:text-indigo-400 mt-0.5">0</div>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-700/60 border border-slate-200/80 dark:border-slate-600 rounded-2xl p-3">
                        <div class="text-xs text-slate-400 font-bold">答對題數</div>
                        <div id="final-correct" class="font-black text-2xl text-emerald-600 dark:text-emerald-400 mt-0.5">0</div>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-700/60 border border-slate-200/80 dark:border-slate-600 rounded-2xl p-3">
                        <div class="text-xs text-slate-400 font-bold">最高連勝</div>
                        <div id="final-streak" class="font-black text-2xl text-amber-600 dark:text-amber-400 mt-0.5">0</div>
                    </div>
                </div>

                <div class="flex flex-wrap items-center justify-center gap-3">
                    <button onclick="startTimedGame()" class="px-7 py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold text-base sm:text-lg shadow-md transition-all flex items-center gap-2 cursor-pointer">
                        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                        <span>再挑戰一次</span>
                    </button>
                    <button onclick="saveAndGoHome()" class="px-6 py-3.5 rounded-2xl bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-bold text-base sm:text-lg transition-all flex items-center gap-2 cursor-pointer">
                        <i data-lucide="home" class="w-5 h-5"></i>
                        <span>回首頁看總分</span>
                    </button>
                </div>
            </div>

            <!-- 限時模式快速對錯閃爍提示條 -->
            <div id="quick-flash-banner" class="hidden absolute top-0 inset-x-0 py-2 text-center text-xs sm:text-sm font-black text-white z-20 transition-all">
            </div>

            <!-- 卡片頂部標籤 -->
            <div class="flex items-center justify-between gap-2 mb-6">
                <div class="flex items-center gap-2">
                    <span id="badge-level" class="px-3 py-1 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600">
                        成語
                    </span>
                    <span id="badge-type" class="px-3 py-1 rounded-xl text-xs font-bold bg-amber-50 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-700/50">
                        字音判斷
                    </span>
                </div>
                <span id="source-tag" class="text-xs text-slate-400 dark:text-slate-500 flex items-center gap-1 font-medium">
                    <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i>
                    教育部標準校對
                </span>
            </div>

            <!-- 核心題目展示區 -->
            <div id="question-content" class="my-auto text-center py-4 animate-pop-in">
                <!-- 動態填入題目 HTML -->
            </div>

            <!-- 詳解與回饋區 (僅休閒練習模式答題後顯示) -->
            <div id="feedback-box" class="hidden mt-6 p-4 sm:p-5 rounded-2xl border text-left animate-pop-in">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                    <div class="flex items-center gap-2">
                        <span id="feedback-icon"></span>
                        <span id="feedback-title" class="font-black text-base sm:text-lg"></span>
                    </div>
                    <span id="feedback-answer-badge" class="text-xs font-bold px-3 py-1 rounded-full"></span>
                </div>
                <p id="feedback-explanation" class="text-sm sm:text-base text-slate-700 dark:text-slate-200 leading-relaxed"></p>
            </div>

        </div>

        <!-- 操作按鈕區 (是 / 否) - 大按鈕高對比設計，適合長輩與孩童 -->
        <div id="action-buttons" class="w-full grid grid-cols-2 gap-4 mt-6">
            <button id="btn-true" onclick="handleAnswer(true)" class="group relative flex items-center justify-center gap-3 py-5 sm:py-6 px-6 rounded-3xl bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-black text-xl sm:text-2xl shadow-lg shadow-emerald-600/25 transition-all cursor-pointer">
                <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                    <i data-lucide="circle" class="w-5 h-5 stroke-[3]"></i>
                </div>
                <span>是（正確）</span>
            </button>

            <button id="btn-false" onclick="handleAnswer(false)" class="group relative flex items-center justify-center gap-3 py-5 sm:py-6 px-6 rounded-3xl bg-rose-600 hover:bg-rose-500 active:scale-[0.98] text-white font-black text-xl sm:text-2xl shadow-lg shadow-rose-600/25 transition-all cursor-pointer">
                <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                    <i data-lucide="x" class="w-5 h-5 stroke-[3]"></i>
                </div>
                <span>否（錯誤）</span>
            </button>
        </div>

        <!-- 下一題按鈕 (休閒練習模式答題後顯示) -->
        <div id="next-button-container" class="hidden w-full mt-6">
            <button id="btn-next" onclick="nextQuestion()" class="w-full py-5 px-6 rounded-3xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-black text-lg sm:text-xl shadow-lg shadow-indigo-600/25 transition-all flex items-center justify-center gap-2 cursor-pointer">
                <span>挑戰下一題</span>
                <i data-lucide="arrow-right" class="w-6 h-6"></i>
            </button>
        </div>

    </main>

    <!-- 底部提示與鍵盤快捷鍵說明 -->
    <footer class="w-full max-w-3xl text-center text-xs text-slate-400 dark:text-slate-500 py-2">
        <p class="hidden sm:block">鍵盤快捷鍵：<kbd class="px-1.5 py-0.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded text-slate-600 dark:text-slate-300">O</kbd> 或 <kbd class="px-1.5 py-0.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded text-slate-600 dark:text-slate-300">←</kbd> 代表「是」，<kbd class="px-1.5 py-0.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded text-slate-600 dark:text-slate-300">X</kbd> 或 <kbd class="px-1.5 py-0.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded text-slate-600 dark:text-slate-300">→</kbd> 代表「否」，<kbd class="px-1.5 py-0.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded text-slate-600 dark:text-slate-300">空白鍵</kbd> 下一題</p>
        <p class="mt-1">題庫依據中華民國教育部《重編國語辭典修訂本》與《一字多音審訂表》編製</p>
    </footer>

    <script>
        // ==========================================
        // 0. 深色模式與首頁計分整合系統
        // ==========================================
        const GAME_ID = 'chinese';
        const HOME_URL = 'index.html';

        // 初始化深色模式 (自動讀取首頁共用的 localStorage 主題設定或系統偏好)
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || savedTheme === 'true' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // 切換深色 / 淺色模式並同步寫入 localStorage
        function toggleDarkMode() {
            const htmlEl = document.documentElement;
            const isDark = htmlEl.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
        }

        // 即時儲存本局成績到 localStorage (供首頁卡片與排行榜讀取)
        function syncScoreToStorage(currentScore) {
            if (currentScore <= 0) return;
            try {
                // 1. 儲存此遊戲最高分 (支援常見命名慣例)
                const bestKey = `bestScore_${GAME_ID}`;
                const prevBest = parseInt(localStorage.getItem(bestKey) || '0', 10);
                if (currentScore > prevBest) {
                    localStorage.setItem(bestKey, currentScore.toString());
                }

                // 2. 儲存統一格式的遊戲紀錄物件 (gameScores)
                const allScores = JSON.parse(localStorage.getItem('gameScores') || '{}');
                const prevRecord = allScores[GAME_ID] || { best: 0, last: 0, plays: 0 };
                allScores[GAME_ID] = {
                    best: Math.max(prevRecord.best || 0, currentScore),
                    last: currentScore,
                    updatedAt: new Date().toISOString()
                };
                localStorage.setItem('gameScores', JSON.stringify(allScores));
            } catch (e) {
                console.warn('無法存取 localStorage 計分資料:', e);
            }
        }

        // 累加總分並返回首頁
        function saveAndGoHome() {
            if (gameState.score > 0 && !gameState.scoreCommitted) {
                syncScoreToStorage(gameState.score);
                try {
                    const totalKey = 'totalScore';
                    const prevTotal = parseInt(localStorage.getItem(totalKey) || '0', 10);
                    localStorage.setItem(totalKey, (prevTotal + gameState.score).toString());
                    gameState.scoreCommitted = true;
                } catch (e) {
                    console.warn('無法更新總分:', e);
                }
            }
            window.location.href = HOME_URL;
        }

        // ==========================================
        // 1. 台灣教育部標準超大型精選題庫 (支援深淺色高對比顯示)
        // ==========================================
        const BUILTIN_QUESTIONS = [
            // --- 單字：部首 ---
            {
                keyword: "凸",
                level: "單字",
                type: "部首",
                promptHtml: `「<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">凸</span>」這個字的部首是「<span class="text-rose-600 dark:text-rose-400 font-black">一</span>」部。`,
                isCorrect: false,
                explanation: "「凸」的部首是「凵」（坎）部，共 5 畫，並非「一」部喔！同樣屬於「凵」部的還有「凹」、「出」、「函」。"
            },
            {
                keyword: "裏",
                level: "單字",
                type: "部首",
                promptHtml: `「<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">裏</span>」（裡面）的部首是「<span class="text-emerald-600 dark:text-emerald-400 font-black">衣</span>」部。`,
                isCorrect: true,
                explanation: "正確！「裏」由「衣」字中間包著「里」組成，部首為「衣」部（異體字為「裡」，部首同樣是「衣」部）。"
            },
            {
                keyword: "耀",

            { keyword: "舊", level: "單字", type: "部首", promptHtml: `「<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">舊</span>」（新舊）的部首是「<span class="text-emerald-600 dark:text-emerald-400 font-black">臼</span>」部。`, isCorrect: true, explanation: "正確！「舊」的部首是最下方的「臼」（ㄐㄧㄡˋ）部，共 18 畫，並非最上方的「艸」部。" },
            { keyword: "題", level: "單字", type: "部首", promptHtml: `「<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">題</span>」（題目）的部首是「<span class="text-rose-600 dark:text-rose-400 font-black">是</span>」部。`, isCorrect: false, explanation: "錯誤！「題」的部首是右邊的「頁」部，共 18 畫。" }
        ];

        // ==========================================
        // 2. 免設定即時雲端題庫擴充引擎 (背景自動預載 + 搜尋校對)
        // ==========================================
        const cloudQuestionPool = [];
        let isFetchingCloud = false;

        // 無需玩家設定 API Key，自動透過執行環境在背景擴充最新考題
        async function fetchCloudQuestionsInBackground(categoryFilter = 'ALL') {
            if (isFetchingCloud) return;
            isFetchingCloud = true;

            const dotEl = document.getElementById('pool-dot');
            if (dotEl) dotEl.className = "w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping";

            const apiKey = ""; // 環境自動注入，無需使用者手動填寫
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const focusTopic = categoryFilter === 'ALL' ? '字音（破音字）、字形（易錯別字）、難檢部首' : `「${categoryFilter}」`;
            const promptText = `請依據中華民國教育部《重編國語辭典修訂本》與《一字多音審訂表》，出 6 題台灣國語文「是非題」（3題正確敘述、3題常見陷阱錯誤敘述），題型聚焦於：${focusTopic}。
請嚴格以 JSON 陣列回傳，每題格式如下：
[
  {
    "keyword": "測驗核心詞彙或單字",
    "level": "單字 或 語詞 或 成語",
    "type": "字音 或 字形 或 部首",
    "promptText": "題目完整敘述（例如：「龜」裂的「龜」讀作「ㄐㄩㄣ」。）",
    "isCorrect": true,
    "explanation": "簡明扼要的教育部標準解析（50字以內）"
  }
]
只回傳純 JSON 陣列，不要任何 markdown 標記或額外文字。`;

            const payload = {
                contents: [{ parts: [{ text: promptText }] }],
                tools: [{ "google_search": {} }],
                generationConfig: {
                    responseMimeType: "application/json"
                }
            };

            try {
                // 指數退避重試機制
                let response = null;
                for (let attempt = 0; attempt < 2; attempt++) {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) break;
                    await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt)));
                }

                if (response && response.ok) {
                    const result = await response.json();
                    const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (rawText) {
                        const cleaned = rawText.replace(/```json|```/g, '').trim();
                        const parsed = JSON.parse(cleaned);
                        if (Array.isArray(parsed)) {
                            parsed.forEach(item => {
                                if (item.keyword && item.promptText && typeof item.isCorrect === 'boolean') {
                                    // 將引號內的重點加上高對比視覺樣式
                                    const styledPrompt = item.promptText.replace(
                                        /「([^」]+)」/g,
                                        `「<span class="text-amber-600 dark:text-amber-400 font-black">$1</span>」`
                                    );
                                    cloudQuestionPool.push({
                                        keyword: `${item.keyword}_cloud_${Date.now()}_${Math.random()}`,
                                        level: item.level || "精選",
                                        type: item.type || "綜合",
                                        promptHtml: styledPrompt,
                                        isCorrect: item.isCorrect,
                                        explanation: item.explanation || "依據教育部國語辭典標準校對。",
                                        isCloud: true
                                    });
                                }
                            });
                            updatePoolBadge();
                        }
                    }
                }
            } catch (err) {
                // 若環境無網路或無預設金鑰，靜默降級使用本地龐大題庫，完全不影響玩家體驗
            } finally {
                isFetchingCloud = false;
                if (dotEl) dotEl.className = "w-1.5 h-1.5 rounded-full bg-emerald-500";
            }
        }

        // ==========================================
        // 3. 本地智慧動態題庫擴充引擎 (離線無窮題庫保障)
        // ==========================================
        function generateExpandedDynamicQuestion(categoryFilter) {
            const dictionaryPool = [
                { word: "聆聽", type: "字音", level: "語詞", correct: true, prompt: `「<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">聆</span>聽」的「聆」讀作「<span class="text-emerald-600 dark:text-emerald-400 font-black">ㄌㄧㄥˊ</span>」。`, exp: "正確！「聆」是聽的意思，讀作ㄌㄧㄥˊ。" },
                { word: "庇護", type: "字音", level: "語詞", correct: true, prompt: `「<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">庇</span>護」的「庇」讀作「<span class="text-emerald-600 dark:text-emerald-400 font-black">ㄅㄧˋ</span>」。`, exp: "正確！「庇」是遮蔽、保護的意思，讀作ㄅㄧˋ。" },
                { word: "覬覦", type: "字音", level: "語詞", correct: true, prompt: `「<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">覬覦</span>」讀作「<span class="text-emerald-600 dark:text-emerald-400 font-black">ㄐㄧˋ ㄩˊ</span>」。`, exp: "正確！「覬覦」指非分的希望或企圖，字音為ㄐㄧˋ ㄩˊ。" },
                { word: "齷齪", type: "字音", level: "語詞", correct: true, prompt: `「<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">齷齪</span>」讀作「<span class="text-emerald-600 dark:text-emerald-400 font-black">ㄨㄛˋ ㄔㄨㄛˋ</span>」。`, exp: "正確！比喻人品卑劣或器量狹小，讀作ㄨㄛˋ ㄔㄨㄛˋ。" },
                { word: "針黹", type: "字音", level: "語詞", correct: true, prompt: `「針<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">黹</span>」的「黹」讀作「<span class="text-emerald-600 dark:text-emerald-400 font-black">ㄓˇ</span>」。`, exp: "正確！「黹」指縫織刺繡的工作，讀作ㄓˇ。" },
                { word: "桎梏", type: "字音", level: "語詞", correct: true, prompt: `「<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">桎梏</span>」讀作「<span class="text-emerald-600 dark:text-emerald-400 font-black">ㄓˋ ㄍㄨˋ</span>」。`, exp: "正確！原指古代刑具，後比喻束縛人心的事物。" },
                { word: "蚍蜉撼樹", type: "字音", level: "成語", correct: true, prompt: `「<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">蚍蜉</span>撼樹」的「蚍蜉」讀作「<span class="text-emerald-600 dark:text-emerald-400 font-black">ㄆㄧˊ ㄈㄨˊ</span>」。`, exp: "正確！「蚍蜉」是大蟻，比喻不自量力。" },
                { word: "錙銖必較", type: "字音", level: "成語", correct: true, prompt: `「<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">錙銖</span>必較」的「錙銖」讀作「<span class="text-emerald-600 dark:text-emerald-400 font-black">ㄗ ㄓㄨ</span>」。`, exp: "正確！比喻極微小的數量或很小的計較。" },
                { word: "怙惡不悛", type: "字音", level: "成語", correct: true, prompt: `「怙惡不<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">悛</span>」的「悛」讀作「<span class="text-emerald-600 dark:text-emerald-400 font-black">ㄑㄩㄢ</span>」。`, exp: "正確！堅持惡行而不肯悔改，悛讀ㄑㄩㄢ。" },
                { word: "炙手可熱", type: "字音", level: "成語", correct: true, prompt: `「<span class="text-amber-600 dark:text-amber-400 underline decoration-amber-400/70 underline-offset-8">炙</span>手可熱」的「炙」讀作「<span class="text-emerald-600 dark:text-emerald-400 font-black">ㄓˋ</span>」。`, exp: "正確！「炙」指烤肉，比喻權勢極盛。" },
                { word: "汗流浃背", type: "字形", level: "成語", correct: false, prompt: `「汗流<span class="text-rose-600 dark:text-rose-400 font-black">浃</span>背」的「浃」字形完全正確。`, exp: "字形錯誤！正確寫法應為「汗流浹（ㄐㄧㄚˊ）背」，為三點水。" },
                { word: "世外桃園", type: "字形", level: "成語", correct: false, prompt: `「世外<span class="text-rose-600 dark:text-rose-400 font-black">桃</span>園」的「桃」字形完全正確。`, exp: "字形錯誤！正確寫法應為「世外桃源」，源自陶淵明桃花源記。" },
                { word: "重蹈覆轍", type: "字形", level: "成語", correct: true, prompt: `「重<span class="text-emerald-600 dark:text-emerald-400 font-black">蹈覆轍</span>」的字形完全正確。`, exp: "正確！比喻不記取教訓，犯相同的錯誤。" },
                { word: "班門弄斧", type: "字形", level: "成語", correct: true, prompt: `「班門弄<span class="text-emerald-600 dark:text-emerald-400 font-black">斧</span>」的字形完全正確。`, exp: "正確！在魯班門前耍弄斧頭，比喻在專家面前現醜。" },
                { word: "走馬看花", type: "字形", level: "成語", correct: true, prompt: `「走馬看<span class="text-emerald-600 dark:text-emerald-400 font-black">花</span>」的字形完全正確。`, exp: "正確！比喻粗略觀賞，沒有深入細緻了解。" },
                { word: "甘拜下風", type: "字形", level: "成語", correct: true, prompt: `「甘拜下<span class="text-emerald-600 dark:text-emerald-400 font-black">風</span>」的字形完全正確。`, exp: "正確！真心佩服別人，自認不如。" },
                { word: "鬼斧神工", type: "字形", level: "成語", correct: true, prompt: `「鬼<span class="text-emerald-600 dark:text-emerald-400 font-black">斧</span>神工」的字形完全正確。`, exp: "正確！形容技藝精巧，非人工所能及。" },
                { word: "瑕不掩瑜", type: "字形", level: "成語", correct: true, prompt: `「瑕不掩<span class="text-emerald-600 dark:text-emerald-400 font-black">瑜</span>」的字形完全正確。`, exp: "正確！比喻缺點掩蓋不了優點。" }
            ];

            const filtered = dictionaryPool.filter(item => categoryFilter === 'ALL' || item.type === categoryFilter);
            if (filtered.length === 0) return BUILTIN_QUESTIONS[Math.floor(Math.random() * BUILTIN_QUESTIONS.length)];

            const template = filtered[Math.floor(Math.random() * filtered.length)];
            const salt = Math.floor(Math.random() * 9999);
            return {
                keyword: `${template.word}_${salt}`,
                level: template.level,
                type: template.type,
                promptHtml: template.prompt,
                isCorrect: template.correct,
                explanation: template.exp
            };
        }

        // ==========================================
        // 3. 遊戲狀態與核心邏輯
        // ==========================================
        let gameState = {
            playMode: 'training', // 'training' (休閒練習) | 'timed' (60秒反應挑戰)
            score: 0,
            streak: 0,
            loseStreak: 0,
            maxStreak: 0,
            correctCount: 0,
            currentQuestion: null,
            isAnswered: false,
            scoreCommitted: false,
            
            sessionSeenKeywords: new Set(),
            globalHistoryKeywords: [],

            timeLeft: 60,
            timerInterval: null,
            timedActive: false
        };

        // 初始化頁面
        window.onload = function() {
            initTheme();
            lucide.createIcons();
            updatePoolBadge();
            nextQuestion();
            // 啟動免金鑰背景即時題庫擴充
            fetchCloudQuestionsInBackground('ALL');
        };

        function updatePoolBadge() {
            const category = document.getElementById('category-filter').value;
            const builtinCount = category === 'ALL' 
                ? BUILTIN_QUESTIONS.length 
                : BUILTIN_QUESTIONS.filter(q => q.type === category).length;
            const cloudCount = category === 'ALL'
                ? cloudQuestionPool.length
                : cloudQuestionPool.filter(q => q.type === category).length;

            if (cloudCount > 0) {
                document.getElementById('pool-count-text').textContent = `精選 ${builtinCount}+ 題 ｜ 雲端即時 +${cloudCount} 題`;
            } else {
                document.getElementById('pool-count-text').textContent = `精選 ${builtinCount}+ 題庫就緒`;
            }
        }

        // 切換遊戲模式（休閒練習 vs 60秒反應挑戰）
        function switchPlayMode(mode) {
            if (gameState.playMode === mode) return;
            gameState.playMode = mode;

            clearInterval(gameState.timerInterval);
            gameState.timedActive = false;

            const btnTraining = document.getElementById('playmode-training');
            const btnTimed = document.getElementById('playmode-timed');
            const timerBox = document.getElementById('timer-box');
            const startOverlay = document.getElementById('timed-start-overlay');
            const resultOverlay = document.getElementById('timed-result-overlay');
            const quickBanner = document.getElementById('quick-flash-banner');

            quickBanner.classList.add('hidden');
            resultOverlay.classList.add('hidden');

            const activeClass = "px-4 py-2 rounded-xl bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition-all flex items-center gap-1.5 cursor-pointer";
            const inactiveClass = "px-4 py-2 rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all flex items-center gap-1.5 cursor-pointer";

            if (mode === 'training') {
                btnTraining.className = activeClass;
                btnTimed.className = inactiveClass;
                timerBox.classList.add('hidden');
                startOverlay.classList.add('hidden');
                resetStats();
                nextQuestion();
            } else {
                btnTimed.className = activeClass;
                btnTraining.className = inactiveClass;
                timerBox.classList.remove('hidden');
                const timerDisplay = document.getElementById('timer-display');
                timerDisplay.textContent = "60s";
                timerDisplay.className = "font-mono font-black text-xl sm:text-2xl text-amber-600 dark:text-amber-400";
                
                document.getElementById('feedback-box').classList.add('hidden');
                document.getElementById('next-button-container').classList.add('hidden');
                document.getElementById('action-buttons').classList.remove('hidden');
                enableAnswerButtons(false);
                startOverlay.classList.remove('hidden');
            }
        }

        function handleCategoryChange() {
            const category = document.getElementById('category-filter').value;
            updatePoolBadge();
            // 切換分類時也背景預載該分類的新題
            fetchCloudQuestionsInBackground(category);
            if (gameState.playMode === 'training' || gameState.timedActive) {
                nextQuestion();
            }
        }

        function resetStats() {
            gameState.score = 0;
            gameState.streak = 0;
            gameState.loseStreak = 0;
            gameState.maxStreak = 0;
            gameState.correctCount = 0;
            gameState.scoreCommitted = false;
            document.getElementById('score-display').textContent = "0";
            document.getElementById('streak-display').textContent = "0";
        }

        function startTimedGame() {
            resetStats();
            gameState.sessionSeenKeywords.clear();
            gameState.timeLeft = 60;
            gameState.timedActive = true;

            document.getElementById('timed-start-overlay').classList.add('hidden');
            document.getElementById('timed-result-overlay').classList.add('hidden');
            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('next-button-container').classList.add('hidden');
            document.getElementById('action-buttons').classList.remove('hidden');

            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.textContent = "60s";
            timerDisplay.className = "font-mono font-black text-xl sm:text-2xl text-amber-600 dark:text-amber-400";

            clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft -= 1;
                timerDisplay.textContent = `${gameState.timeLeft}s`;

                if (gameState.timeLeft <= 10) {
                    timerDisplay.className = "font-mono font-black text-xl sm:text-2xl text-rose-600 dark:text-rose-400 animate-pulse-fast";
                }

                if (gameState.timeLeft <= 0) {
                    endTimedGame();
                }
            }, 1000);

            nextQuestion();
        }

        function endTimedGame() {
            clearInterval(gameState.timerInterval);
            gameState.timedActive = false;
            enableAnswerButtons(false);
            document.getElementById('quick-flash-banner').classList.add('hidden');

            // 結算時自動同步最高分到 localStorage
            syncScoreToStorage(gameState.score);

            document.getElementById('final-score').textContent = gameState.score;
            document.getElementById('final-correct').textContent = gameState.correctCount;
            document.getElementById('final-streak').textContent = gameState.maxStreak;

            let comment = "再接再厲，多練習就能掌握破音字訣竅！";
            if (gameState.score >= 300) comment = "神乎其技！你是國語文大師等級！";
            else if (gameState.score >= 180) comment = "太厲害了！字音字形難不倒你！";
            else if (gameState.score >= 80) comment = "表現相當亮眼，繼續保持手感！";
            document.getElementById('result-comment').textContent = comment;

            document.getElementById('timed-result-overlay').classList.remove('hidden');
            lucide.createIcons();
        }

        function pickNextQuestion() {
            const category = document.getElementById('category-filter').value;

            // 優先檢查是否有尚未作答的「即時雲端題庫」
            const cloudCandidates = cloudQuestionPool.filter(q => {
                const matchCat = (category === 'ALL' || q.type === category);
                return matchCat && !gameState.sessionSeenKeywords.has(q.keyword);
            });

            // 當雲端題庫剩餘不足 2 題時，背景自動再補充一批
            if (cloudCandidates.length <= 2) {
                fetchCloudQuestionsInBackground(category);
            }

            // 混合抽取（若有雲端新題，40% 機率優先出現雲端新題，保持新鮮感）
            if (cloudCandidates.length > 0 && Math.random() < 0.4) {
                return cloudCandidates[Math.floor(Math.random() * cloudCandidates.length)];
            }

            const candidates = BUILTIN_QUESTIONS.filter(q => {
                const matchCat = (category === 'ALL' || q.type === category);
                const notSeenSession = !gameState.sessionSeenKeywords.has(q.keyword);
                const notSeenRecent = !gameState.globalHistoryKeywords.includes(q.keyword);
                return matchCat && notSeenSession && notSeenRecent;
            });

            if (candidates.length > 0) {
                return candidates[Math.floor(Math.random() * candidates.length)];
            }

            if (cloudCandidates.length > 0) {
                return cloudCandidates[Math.floor(Math.random() * cloudCandidates.length)];
            }

            const fallbackCandidates = BUILTIN_QUESTIONS.filter(q => {
                const matchCat = (category === 'ALL' || q.type === category);
                return matchCat && !gameState.sessionSeenKeywords.has(q.keyword);
            });

            if (fallbackCandidates.length > 0) {
                return fallbackCandidates[Math.floor(Math.random() * fallbackCandidates.length)];
            }

            return generateExpandedDynamicQuestion(category);
        }

        function nextQuestion() {
            const q = pickNextQuestion();
            gameState.currentQuestion = q;
            gameState.isAnswered = false;

            gameState.sessionSeenKeywords.add(q.keyword);
            gameState.globalHistoryKeywords.push(q.keyword);
            if (gameState.globalHistoryKeywords.length > 200) {
                gameState.globalHistoryKeywords.shift();
            }

            document.getElementById('badge-level').textContent = q.level;
            document.getElementById('badge-type').textContent = `${q.type}判斷`;

            // 更新來源標籤（區分內建精選與雲端即時生成）
            const sourceTag = document.getElementById('source-tag');
            if (q.isCloud) {
                sourceTag.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4 text-indigo-500"></i> 雲端即時搜尋校對`;
            } else {
                sourceTag.innerHTML = `<i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i> 教育部標準校對`;
            }
            lucide.createIcons();

            const contentEl = document.getElementById('question-content');
            contentEl.classList.remove('animate-pop-in');
            void contentEl.offsetWidth;
            contentEl.classList.add('animate-pop-in');
            contentEl.innerHTML = `
                <p class="font-serif-tc text-2xl sm:text-3xl md:text-4xl font-bold text-slate-900 dark:text-white leading-relaxed tracking-wide">
                    ${q.promptHtml}
                </p>
            `;

            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('next-button-container').classList.add('hidden');
            document.getElementById('action-buttons').classList.remove('hidden');
            enableAnswerButtons(true);
        }

        function handleAnswer(userChoice) {
            if (gameState.isAnswered) return;
            if (gameState.playMode === 'timed' && !gameState.timedActive) return;

            gameState.isAnswered = true;
            enableAnswerButtons(false);

            const q = gameState.currentQuestion;
            const isRight = (userChoice === q.isCorrect);
            let penaltyPoints = 0;

            if (isRight) {
                gameState.streak += 1;
                gameState.loseStreak = 0;
                gameState.correctCount += 1;
                if (gameState.streak > gameState.maxStreak) {
                    gameState.maxStreak = gameState.streak;
                }
                const bonus = Math.min(gameState.streak * 2, 20);
                gameState.score += (10 + bonus);
                // 每次得分即更新最高分紀錄
                syncScoreToStorage(gameState.score);
            } else {
                gameState.streak = 0;
                gameState.loseStreak += 1;
                if (gameState.loseStreak >= 2) {
                    penaltyPoints = Math.min((gameState.loseStreak - 1) * 5, 20);
                    gameState.score = Math.max(0, gameState.score - penaltyPoints);
                }
                const card = document.getElementById('question-card');
                card.classList.add('animate-shake');
                setTimeout(() => card.classList.remove('animate-shake'), 350);
            }

            document.getElementById('score-display').textContent = gameState.score;
            document.getElementById('streak-display').textContent = gameState.streak;

            if (gameState.playMode === 'timed') {
                const banner = document.getElementById('quick-flash-banner');
                banner.classList.remove('hidden', 'bg-emerald-600', 'bg-rose-600');
                if (isRight) {
                    banner.classList.add('bg-emerald-600');
                    banner.textContent = `✓ 正確！連勝 ${gameState.streak}`;
                } else {
                    banner.classList.add('bg-rose-600');
                    const penaltyText = penaltyPoints > 0 ? `（連錯 ${gameState.loseStreak} 題，倒扣 ${penaltyPoints} 分！）` : '';
                    banner.textContent = `✗ 錯誤！正解為「${q.isCorrect ? '是' : '否'}」${penaltyText}`;
                }

                setTimeout(() => {
                    banner.classList.add('hidden');
                    if (gameState.timedActive) {
                        nextQuestion();
                    }
                }, 420);
            } else {
                const feedbackBox = document.getElementById('feedback-box');
                const feedbackIcon = document.getElementById('feedback-icon');
                const feedbackTitle = document.getElementById('feedback-title');
                const feedbackBadge = document.getElementById('feedback-answer-badge');
                const feedbackExp = document.getElementById('feedback-explanation');

                feedbackBox.className = "mt-6 p-4 sm:p-5 rounded-2xl border text-left animate-pop-in";
                
                if (isRight) {
                    feedbackBox.classList.add('bg-emerald-50/90', 'dark:bg-emerald-950/50', 'border-emerald-200', 'dark:border-emerald-800/70');
                    feedbackIcon.innerHTML = `<i data-lucide="check-circle-2" class="w-6 h-6 text-emerald-600 dark:text-emerald-400"></i>`;
                    feedbackTitle.textContent = "答對了！觀察入微！";
                    feedbackTitle.className = "font-black text-base sm:text-lg text-emerald-800 dark:text-emerald-300";
                } else {
                    feedbackBox.classList.add('bg-rose-50/90', 'dark:bg-rose-950/50', 'border-rose-200', 'dark:border-rose-800/70');
                    feedbackIcon.innerHTML = `<i data-lucide="x-circle" class="w-6 h-6 text-rose-600 dark:text-rose-400"></i>`;
                    feedbackTitle.textContent = penaltyPoints > 0 
                        ? `連續答錯 ${gameState.loseStreak} 題！倒扣 ${penaltyPoints} 分！` 
                        : "可惜，掉進陷阱囉！";
                    feedbackTitle.className = "font-black text-base sm:text-lg text-rose-800 dark:text-rose-300";
                }

                if (q.isCorrect) {
                    feedbackBadge.textContent = "正解：是（敘述正確）";
                    feedbackBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-emerald-100 dark:bg-emerald-900/70 text-emerald-800 dark:text-emerald-200";
                } else {
                    feedbackBadge.textContent = "正解：否（敘述有誤）";
                    feedbackBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-rose-100 dark:bg-rose-900/70 text-rose-800 dark:text-rose-200";
                }

                feedbackExp.textContent = q.explanation;

                document.getElementById('action-buttons').classList.add('hidden');
                document.getElementById('next-button-container').classList.remove('hidden');
                lucide.createIcons();
            }
        }

        function enableAnswerButtons(enabled) {
            document.getElementById('btn-true').disabled = !enabled;
            document.getElementById('btn-false').disabled = !enabled;
        }

        // 鍵盤快捷鍵支援
        document.addEventListener('keydown', (e) => {
            if (gameState.playMode === 'timed' && !gameState.timedActive) {
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    startTimedGame();
                }
                return;
            }

            if (!gameState.isAnswered) {
                if (e.key === 'o' || e.key === 'O' || e.key === 'ArrowLeft') {
                    handleAnswer(true);
                } else if (e.key === 'x' || e.key === 'X' || e.key === 'ArrowRight') {
                    handleAnswer(false);
                }
            } else if (gameState.playMode === 'training') {
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    nextQuestion();
                }
            }
        });
    </script>
</body>
</html>
