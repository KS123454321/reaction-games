<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>夜市打地鼠 - 反應遊樂園</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-color: #FFF8E7;
            --text-color: #3E2723;
            --subtext-color: #6D4C41;
            --hole-bg: #D7CCC8;
            --hole-active: #BCAAA4;
            --hole-shadow: rgba(0, 0, 0, 0.14);
            --card-bg: #FFFFFF;
            --border-color: #E0E0E0;
            --stat-bg: #FAF3E3;
        }

        body.dark-mode {
            --bg-color: #1A1C20;
            --text-color: #F1F3F5;
            --subtext-color: #ADB5BD;
            --hole-bg: #2C3038;
            --hole-active: #3B404B;
            --hole-shadow: rgba(0, 0, 0, 0.45);
            --card-bg: #252830;
            --border-color: #3A3F4B;
            --stat-bg: #2E333D;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        html, body {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.25s ease, color 0.25s ease, box-shadow 0.3s ease;
        }

        body.fever-active {
            box-shadow: inset 0 0 28px rgba(255, 111, 0, 0.55);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-theme {
            background: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            touch-action: manipulation;
        }

        .btn-theme:active {
            transform: scale(0.95);
        }

        .game-container {
            text-align: center;
            max-width: 480px;
            margin: 0 auto;
            padding: 0 12px;
            position: relative;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 9px 14px;
            margin: 10px 0 8px;
            font-size: 1.05rem;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
            gap: 6px;
        }

        .level-badge {
            background: #FF9800;
            color: #FFF;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.95rem;
        }

        .combo-pill {
            background: rgba(255, 152, 0, 0.16);
            color: #E65100;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            transition: transform 0.12s ease;
        }

        body.dark-mode .combo-pill {
            background: rgba(255, 167, 38, 0.2);
            color: #FFB74D;
        }

        .combo-pill.bump {
            transform: scale(1.16);
        }

        .lives-box {
            letter-spacing: 2px;
            font-size: 1.2rem;
        }

        .fever-bar-wrap {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 7px 12px;
            margin-bottom: 10px;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .fever-bar-wrap.active {
            border-color: #FF6F00;
            box-shadow: 0 0 12px rgba(255, 111, 0, 0.35);
        }

        .fever-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
            font-weight: 800;
            margin-bottom: 5px;
            color: var(--subtext-color);
        }

        .fever-bar-wrap.active .fever-header {
            color: #FF6F00;
        }

        body.dark-mode .fever-bar-wrap.active .fever-header {
            color: #FFA726;
        }

        .fever-track {
            width: 100%;
            height: 10px;
            background: rgba(128, 128, 128, 0.2);
            border-radius: 999px;
            overflow: hidden;
        }

        .fever-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FFB300, #FF6F00);
            border-radius: 999px;
            transition: width 0.15s ease;
        }

        .fever-bar-wrap.active .fever-fill {
            background: linear-gradient(90deg, #FF3D00, #FFD600);
            transition: width 0.08s linear;
        }

        .fever-banner {
            position: fixed;
            top: 18%;
            left: 50%;
            transform: translate(-50%, -20px) scale(0.8);
            background: linear-gradient(135deg, #FF3D00, #FF9100);
            color: #FFFFFF;
            padding: 12px 22px;
            border-radius: 18px;
            border: 3px solid #FFF59D;
            box-shadow: 0 10px 28px rgba(255, 61, 0, 0.45);
            font-size: 1.15rem;
            font-weight: 900;
            z-index: 90;
            pointer-events: none;
            opacity: 0;
            white-space: nowrap;
            transition: opacity 0.22s ease, transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .fever-banner.show {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
        }

        .fever-banner small {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #FFF9C4;
            margin-top: 2px;
        }

        #msg {
            min-height: 1.5em;
            font-size: 1rem;
            color: var(--subtext-color);
            margin: 6px 0 10px;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin: 12px 0;
            width: 100%;
            touch-action: manipulation;
        }

        .hole {
            background: var(--hole-bg);
            border-radius: 20px;
            aspect-ratio: 1 / 1;
            min-height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 8px 0 var(--hole-shadow);
            transition: background-color 0.15s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .hole.active {
            background: var(--hole-active);
        }

        body.fever-active .hole.active {
            box-shadow: inset 0 8px 0 var(--hole-shadow), 0 0 10px rgba(255, 145, 0, 0.45);
        }

        .mole-sprite {
            font-size: 3.3rem;
            line-height: 1;
            transform: scale(0) translateY(15px);
            opacity: 0;
            transition: transform 0.14s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.12s ease;
            pointer-events: none;
            display: inline-block;
            width: 1.2em;
            text-align: center;
        }

        .hole.active .mole-sprite {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .hole.hit-anim .mole-sprite {
            transform: scale(0.75);
        }

        .hit-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #E53935;
            color: #FFFFFF;
            font-size: 0.9rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 12px;
            border: 2px solid #FFFFFF;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            display: none;
            z-index: 2;
        }

        .hit-badge.one-left {
            background: #FB8C00;
        }

        .hit-badge.heal-badge {
            background: #2E7D32;
        }

        .float-tip {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.92rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            pointer-events: none;
            animation: floatUp 0.65s ease-out forwards;
            white-space: nowrap;
            z-index: 3;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -22px); }
        }

        @keyframes damageFlash {
            0%, 100% { box-shadow: inset 0 0 0 0 rgba(231, 76, 60, 0); }
            30% { box-shadow: inset 0 0 0 8px rgba(231, 76, 60, 0.65); }
        }

        body.damage-effect {
            animation: damageFlash 0.35s ease;
        }

        .legend-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.88rem;
            color: var(--subtext-color);
            margin-top: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            border-radius: 12px;
        }

        .summary-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.58);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .summary-overlay.show {
            display: flex;
            opacity: 1;
        }

        .summary-card {
            background: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 22px;
            width: 100%;
            max-width: 390px;
            padding: 22px 18px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
            transform: scale(0.92);
            transition: transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.2);
        }

        .summary-overlay.show .summary-card {
            transform: scale(1);
        }

        .summary-title {
            font-size: 1.45rem;
            font-weight: 800;
            margin: 0 0 4px;
        }

        .summary-score-box {
            font-size: 2rem;
            font-weight: 900;
            color: #FF8F00;
            margin: 4px 0 14px;
        }

        .summary-rows {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0 16px;
        }

        .summary-row {
            background: var(--stat-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .summary-row-label {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--subtext-color);
            white-space: nowrap;
        }

        .summary-row-items {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
            font-size: 1.25rem;
            font-weight: 800;
        }

        .icon-count {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .icon-count .num {
            font-size: 1.1rem;
        }

        .num.good { color: #2E7D32; }
        .num.miss { color: #E65100; }
        .num.bad  { color: #C62828; }

        body.dark-mode .num.good { color: #66BB6A; }
        body.dark-mode .num.miss { color: #FFA726; }
        body.dark-mode .num.bad  { color: #EF5350; }

        .summary-detail {
            font-size: 0.9rem;
            color: var(--subtext-color);
            margin-bottom: 14px;
            line-height: 1.55;
        }

        .btn-restart {
            width: 100%;
            font-size: 1.15rem;
            padding: 12px 20px;
            border-radius: 14px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn-restart:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <button class="btn-home" onclick="exitToHome(isStarted)">🏠 回首頁</button>
        <div class="nav-right">
            <button class="btn-theme" id="theme-btn" onclick="toggleDarkMode()">🌙 深色</button>
            <div class="score-display">得分：<span id="score">0</span></div>
        </div>
    </div>

    <div class="fever-banner" id="fever-banner">
        🔥 熱血狀態啟動！
        <small>得分 ×2 · 鐵頭地鼠一擊必殺！</small>
    </div>
    
    <div class="game-container">
        <h2>🐹 夜市打地鼠</h2>

        <div class="status-bar">
            <div>等級：<span class="level-badge" id="level-display">Lv.1</span></div>
            <div class="combo-pill" id="combo-display">🔥 0 連擊</div>
            <div class="lives-box" id="lives-display" aria-label="剩餘生命值">❤️❤️❤️</div>
        </div>

        <div class="fever-bar-wrap" id="fever-bar-wrap">
            <div class="fever-header">
                <span id="fever-label">⚡ 熱血集氣：0 / 8</span>
                <span id="fever-timer-text">滿 8 連擊啟動</span>
            </div>
            <div class="fever-track">
                <div class="fever-fill" id="fever-fill"></div>
            </div>
        </div>

        <p id="msg">漏掉地鼠或打到警察都會扣愛心喔！</p>

        <div style="margin-bottom: 12px;" id="config-box">
            <button class="btn-big" style="font-size: 1.15rem; padding: 12px 26px; touch-action: manipulation;" onclick="startGame()">開始遊戲 ▶</button>
        </div>

        <div class="grid" id="mole-grid">
            <div class="hole" onpointerdown="hit(0, event)"><span class="hit-badge"></span><span class="mole-sprite"></span></div>
            <div class="hole" onpointerdown="hit(1, event)"><span class="hit-badge"></span><span class="mole-sprite"></span></div>
            <div class="hole" onpointerdown="hit(2, event)"><span class="hit-badge"></span><span class="mole-sprite"></span></div>
            <div class="hole" onpointerdown="hit(3, event)"><span class="hit-badge"></span><span class="mole-sprite"></span></div>
            <div class="hole" onpointerdown="hit(4, event)"><span class="hit-badge"></span><span class="mole-sprite"></span></div>
            <div class="hole" onpointerdown="hit(5, event)"><span class="hit-badge"></span><span class="mole-sprite"></span></div>
            <div class="hole" onpointerdown="hit(6, event)"><span class="hit-badge"></span><span class="mole-sprite"></span></div>
            <div class="hole" onpointerdown="hit(7, event)"><span class="hit-badge"></span><span class="mole-sprite"></span></div>
            <div class="hole" onpointerdown="hit(8, event)"><span class="hit-badge"></span><span class="mole-sprite"></span></div>
        </div>

        <div class="legend-box">
            <span>🐹 普通 (+1)</span>
            <span>🐻‍❄️ 鐵頭 ×2 (+3)</span>
            <span>💖 補血 (+1❤️)</span>
            <span>👮‍♂️ 警察 (-1❤️)</span>
        </div>
    </div>

    <!-- 結算視窗 -->
    <div class="summary-overlay" id="summary-overlay" role="dialog" aria-modal="true" aria-labelledby="summary-title">
        <div class="summary-card" onclick="event.stopPropagation()">
            <h3 class="summary-title" id="summary-title">本局結算</h3>
            <div class="summary-score-box"><span id="sum-score">0</span> 分 <span id="sum-record" style="font-size: 1rem;"></span></div>

            <div class="summary-rows">
                <div class="summary-row">
                    <span class="summary-row-label">擊中地鼠</span>
                    <div class="summary-row-items">
                        <span class="icon-count">🐹<span class="num good" id="sum-hit-normal">×0</span></span>
                        <span class="icon-count">🐻‍❄️<span class="num good" id="sum-hit-armored">×0</span></span>
                    </div>
                </div>

                <div class="summary-row">
                    <span class="summary-row-label">漏掉地鼠</span>
                    <div class="summary-row-items">
                        <span class="icon-count">🐹<span class="num miss" id="sum-miss-normal">×0</span></span>
                        <span class="icon-count">🐻‍❄️<span class="num miss" id="sum-miss-armored">×0</span></span>
                    </div>
                </div>

                <div class="summary-row">
                    <span class="summary-row-label">誤打警察</span>
                    <div class="summary-row-items">
                        <span class="icon-count">👮‍♂️<span class="num bad" id="sum-police">×0</span></span>
                    </div>
                </div>
            </div>

            <div class="summary-detail" id="sum-detail"></div>

            <button class="btn-big btn-restart" id="btn-restart" onclick="startGame()" disabled>再玩一次 ▶</button>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        let lastTouchEndTime = 0;
        document.addEventListener('touchend', function (e) {
            const now = Date.now();
            if (now - lastTouchEndTime <= 320) {
                e.preventDefault();
            }
            lastTouchEndTime = now;
        }, { passive: false });

        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        }, { passive: false });

        const MAX_LIVES = 3;
        const FEVER_TARGET = 8;
        const FEVER_DURATION = 6000;

        let score = 0;
        let lives = MAX_LIVES;
        let level = 1;
        let isStarted = false;
        let isEnding = false;

        let totalCombo = 0;
        let maxCombo = 0;
        let feverCharge = 0;
        let isFever = false;
        let feverEndTime = 0;
        let feverTickTimer = null;
        let feverBannerTimer = null;

        let spawnTimer = null;
        let summaryTimer = null;
        let restartEnableTimer = null;

        let stats = {
            normalHit: 0,
            armoredHit: 0,
            missedNormal: 0,
            missedArmored: 0,
            policeHit: 0,
            feverCount: 0
        };

        const holes = Array.from(document.querySelectorAll('.hole')).map((el, idx) => ({
            index: idx,
            el: el,
            spriteEl: el.querySelector('.mole-sprite'),
            badgeEl: el.querySelector('.hit-badge'),
            active: false,
            type: null,
            hp: 0,
            hideTimeout: null
        }));

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || localStorage.getItem('darkMode');
            if (savedTheme === 'dark' || savedTheme === 'true') {
                document.body.classList.add('dark-mode');
            }
            updateThemeBtn();
        }

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            updateThemeBtn();
        }

        function updateThemeBtn() {
            const btn = document.getElementById('theme-btn');
            const isDark = document.body.classList.contains('dark-mode');
            btn.innerText = isDark ? '☀️ 亮色' : '🌙 深色';
        }

        initTheme();

        function getLevelConfig(lvl) {
            const configs = [
                { maxConcurrent: 1, spawnInterval: 950,  stayDuration: 1550, armoredChance: 0.00, policeChance: 0.18 },
                { maxConcurrent: 2, spawnInterval: 820,  stayDuration: 1450, armoredChance: 0.20, policeChance: 0.22 },
                { maxConcurrent: 3, spawnInterval: 700,  stayDuration: 1350, armoredChance: 0.28, policeChance: 0.24 },
                { maxConcurrent: 3, spawnInterval: 600,  stayDuration: 1250, armoredChance: 0.35, policeChance: 0.26 },
                { maxConcurrent: 4, spawnInterval: 520,  stayDuration: 1150, armoredChance: 0.40, policeChance: 0.28 },
                { maxConcurrent: 5, spawnInterval: 450,  stayDuration: 1050, armoredChance: 0.45, policeChance: 0.30 }
            ];
            return configs[Math.min(lvl - 1, configs.length - 1)];
        }

        function startGame() {
            clearTimeout(spawnTimer);
            clearTimeout(summaryTimer);
            clearTimeout(restartEnableTimer);
            clearInterval(feverTickTimer);
            clearTimeout(feverBannerTimer);

            score = 0;
            lives = MAX_LIVES;
            level = 1;
            isStarted = true;
            isEnding = false;

            totalCombo = 0;
            maxCombo = 0;
            feverCharge = 0;
            isFever = false;
            document.body.classList.remove('fever-active');
            document.getElementById('fever-banner').classList.remove('show');

            stats = {
                normalHit: 0,
                armoredHit: 0,
                missedNormal: 0,
                missedArmored: 0,
                policeHit: 0,
                feverCount: 0
            };

            hideSummaryModal();
            clearAllHoles();
            updateUI();

            document.getElementById('config-box').style.display = 'none';
            document.getElementById('msg').innerText = '連續擊中累積連擊，集滿 8 連擊進入熱血！';

            scheduleNextSpawn(150);
        }

        function scheduleNextSpawn(delay) {
            if (!isStarted || isEnding) return;
            clearTimeout(spawnTimer);
            spawnTimer = setTimeout(() => {
                if (!isStarted || isEnding) return;
                spawnMole();
                const cfg = getLevelConfig(level);
                const baseInterval = isFever ? cfg.spawnInterval * 0.88 : cfg.spawnInterval;
                const jitter = (Math.random() * 140) - 70;
                scheduleNextSpawn(Math.max(300, baseInterval + jitter));
            }, delay);
        }

        function spawnMole() {
            if (!isStarted || isEnding) return;
            const cfg = getLevelConfig(level);
            const activeCount = holes.filter(h => h.active).length;

            if (activeCount >= cfg.maxConcurrent) return;

            const emptyHoles = holes.filter(h => !h.active);
            if (emptyHoles.length === 0) return;

            const target = emptyHoles[Math.floor(Math.random() * emptyHoles.length)];
            const roll = Math.random();

            const hasActiveHeart = holes.some(h => h.active && h.type === 'heart');
            const heartChance = (lives < MAX_LIVES && !hasActiveHeart) ? 0.07 : 0;

            target.active = true;
            target.el.classList.add('active');

            if (roll < heartChance) {
                target.type = 'heart';
                target.hp = 1;
                target.spriteEl.innerText = '💖';
                target.badgeEl.innerText = '+1❤️';
                target.badgeEl.classList.remove('one-left');
                target.badgeEl.classList.add('heal-badge');
                target.badgeEl.style.display = 'inline-block';
            } else if (roll < heartChance + cfg.policeChance) {
                target.type = 'police';
                target.hp = 1;
                target.spriteEl.innerText = '👮‍♂️';
                target.badgeEl.style.display = 'none';
            } else if (roll < heartChance + cfg.policeChance + cfg.armoredChance) {
                target.type = 'armored';
                target.hp = isFever ? 1 : 2;
                target.spriteEl.innerText = '🐻‍❄️';
                target.badgeEl.innerText = isFever ? '一擊!' : '打2下';
                target.badgeEl.classList.remove('one-left', 'heal-badge');
                if (isFever) target.badgeEl.classList.add('one-left');
                target.badgeEl.style.display = 'inline-block';
            } else {
                target.type = 'normal';
                target.hp = 1;
                target.spriteEl.innerText = '🐹';
                target.badgeEl.style.display = 'none';
            }

            let stayTime = cfg.stayDuration;
            if (target.type === 'armored' && !isFever) stayTime += 350;
            if (target.type === 'heart') stayTime = Math.max(1050, cfg.stayDuration * 0.9);

            target.hideTimeout = setTimeout(() => {
                onMoleExpire(target);
            }, stayTime);
        }

        function onMoleExpire(hole) {
            if (!hole.active || !isStarted || isEnding) return;
            const expiredType = hole.type;
            resetHole(hole);

            if (expiredType === 'normal') {
                stats.missedNormal++;
                showFloatTip(hole.el, '漏掉🐹 -1❤️', '#E74C3C');
                loseLife('漏掉普通地鼠了！扣 1 顆愛心', false);
            } else if (expiredType === 'armored') {
                stats.missedArmored++;
                showFloatTip(hole.el, '漏掉🐻‍❄️ -1❤️', '#E74C3C');
                loseLife('漏掉鐵頭地鼠了！扣 1 顆愛心', false);
            }
        }

        function hit(index, e) {
            if (e) e.preventDefault();
            if (!isStarted || isEnding) return;
            const hole = holes[index];
            if (!hole.active) return;

            hole.el.classList.add('hit-anim');
            setTimeout(() => hole.el.classList.remove('hit-anim'), 90);

            if (hole.type === 'police') {
                stats.policeHit++;
                clearTimeout(hole.hideTimeout);
                resetHole(hole);
                if (typeof playSound === 'function') playSound('bad');
                showFloatTip(hole.el, '誤擊警察 -1❤️', '#E74C3C');
                loseLife('哎呀！打到警察了，扣 1 顆愛心', true);
                return;
            }

            if (hole.type === 'heart') {
                clearTimeout(hole.hideTimeout);
                resetHole(hole);
                if (typeof playSound === 'function') playSound('good');
                if (lives < MAX_LIVES) {
                    lives++;
                    showFloatTip(hole.el, '恢復 +1❤️', '#2ECC71');
                    document.getElementById('msg').innerText = '💖 吃到愛心補給！恢復 1 顆生命！';
                } else {
                    score += 2;
                    showFloatTip(hole.el, '滿血加分 +2', '#2ECC71');
                }
                updateUI();
                checkEmptyBoard();
                return;
            }

            if (hole.type === 'armored' && hole.hp > 1) {
                hole.hp = 1;
                hole.spriteEl.innerText = '😵';
                hole.badgeEl.innerText = '剩1下!';
                hole.badgeEl.classList.add('one-left');
                if (typeof playSound === 'function') playSound('good');
                showFloatTip(hole.el, '再敲一下！', '#FF9800');

                clearTimeout(hole.hideTimeout);
                const cfg = getLevelConfig(level);
                hole.hideTimeout = setTimeout(() => onMoleExpire(hole), Math.max(850, cfg.stayDuration * 0.75));
                return;
            }

            const isArmored = (hole.type === 'armored');
            if (isArmored) {
                stats.armoredHit++;
            } else {
                stats.normalHit++;
            }

            clearTimeout(hole.hideTimeout);
            resetHole(hole);

            totalCombo++;
            if (totalCombo > maxCombo) maxCombo = totalCombo;

            const comboEl = document.getElementById('combo-display');
            comboEl.classList.remove('bump');
            void comboEl.offsetWidth;
            comboEl.classList.add('bump');

            const basePoints = isArmored ? 3 : 1;
            const feverMultiplier = isFever ? 2 : 1;
            const comboBonus = (totalCombo % 5 === 0) ? 1 : 0;
            const gained = (basePoints * feverMultiplier) + comboBonus;

            score += gained;
            if (typeof playSound === 'function') playSound('good');

            const tipText = comboBonus > 0 ? `+${gained} (連擊獎勵!)` : `+${gained}`;
            showFloatTip(hole.el, tipText, isFever ? '#FFD600' : '#2ECC71');

            if (!isFever) {
                feverCharge++;
                if (feverCharge >= FEVER_TARGET) {
                    activateFever();
                }
            }

            const newLevel = Math.min(6, Math.floor(score / 10) + 1);
            if (newLevel > level) {
                level = newLevel;
                document.getElementById('msg').innerText = `🔥 升級到 Lv.${level}！地鼠速度加快！`;
            } else if (isFever) {
                document.getElementById('msg').innerText = `⚡ 熱血狀態中！連擊 ${totalCombo}，得分雙倍！`;
            } else if (comboBonus > 0) {
                document.getElementById('msg').innerText = `🎯 ${totalCombo} 連擊達成！額外 +1 分！`;
            } else {
                document.getElementById('msg').innerText = isArmored ? '擊倒鐵頭地鼠！' : '打中地鼠！';
            }

            updateUI();
            checkEmptyBoard();
        }

        function checkEmptyBoard() {
            const remainingActive = holes.filter(h => h.active).length;
            if (remainingActive === 0) {
                scheduleNextSpawn(150);
            }
        }

        function activateFever() {
            isFever = true;
            feverCharge = FEVER_TARGET;
            feverEndTime = Date.now() + FEVER_DURATION;
            stats.feverCount++;

            document.body.classList.add('fever-active');

            holes.forEach(h => {
                if (h.active && h.type === 'armored') {
                    h.hp = 1;
                    h.badgeEl.innerText = '一擊!';
                    h.badgeEl.classList.add('one-left');
                }
            });

            const banner = document.getElementById('fever-banner');
            banner.classList.add('show');
            clearTimeout(feverBannerTimer);
            feverBannerTimer = setTimeout(() => {
                banner.classList.remove('show');
            }, 1500);

            if (navigator.vibrate) {
                navigator.vibrate([60, 40, 80]);
            }

            clearInterval(feverTickTimer);
            feverTickTimer = setInterval(() => {
                if (!isStarted || isEnding || !isFever) {
                    clearInterval(feverTickTimer);
                    return;
                }
                const remaining = feverEndTime - Date.now();
                if (remaining <= 0) {
                    endFever(false);
                } else {
                    updateFeverBar(remaining);
                }
            }, 60);

            updateUI();
        }

        function endFever(brokenByMistake) {
            isFever = false;
            feverCharge = 0;
            clearInterval(feverTickTimer);
            document.body.classList.remove('fever-active');
            document.getElementById('fever-banner').classList.remove('show');

            if (!brokenByMistake && isStarted && !isEnding) {
                document.getElementById('msg').innerText = '熱血時間結束，繼續累積連擊吧！';
            }
            updateUI();
        }

        function updateFeverBar(remainingMs) {
            const wrap = document.getElementById('fever-bar-wrap');
            const label = document.getElementById('fever-label');
            const timerText = document.getElementById('fever-timer-text');
            const fill = document.getElementById('fever-fill');

            if (isFever) {
                wrap.classList.add('active');
                const sec = Math.max(0, remainingMs / 1000).toFixed(1);
                const pct = Math.max(0, Math.min(100, (remainingMs / FEVER_DURATION) * 100));
                label.innerText = '🔥 熱血狀態中（得分 ×2）';
                timerText.innerText = `剩餘 ${sec} 秒`;
                fill.style.width = `${pct}%`;
            } else {
                wrap.classList.remove('active');
                const pct = Math.min(100, (feverCharge / FEVER_TARGET) * 100);
                label.innerText = `⚡ 熱血集氣：${feverCharge} / ${FEVER_TARGET}`;
                timerText.innerText = `再 ${FEVER_TARGET - feverCharge} 連擊啟動`;
                fill.style.width = `${pct}%`;
            }
        }

        function loseLife(reasonText, isPoliceHit) {
            totalCombo = 0;
            if (isFever) {
                endFever(true);
            } else {
                feverCharge = 0;
            }

            lives = Math.max(0, lives - 1);
            updateUI();
            document.getElementById('msg').innerText = `${reasonText}（連擊歸零）`;

            document.body.classList.remove('damage-effect');
            void document.body.offsetWidth;
            document.body.classList.add('damage-effect');

            if (navigator.vibrate) {
                navigator.vibrate(isPoliceHit ? [110, 60, 110] : [140]);
            }

            if (lives <= 0) {
                beginEndSequence();
            }
        }

        function beginEndSequence() {
            isEnding = true;
            isStarted = false;
            clearTimeout(spawnTimer);
            clearInterval(feverTickTimer);
            document.body.classList.remove('fever-active');

            holes.forEach(h => {
                clearTimeout(h.hideTimeout);
            });

            document.getElementById('msg').innerText = '💥 生命值歸零！正在統計本局成績...';

            summaryTimer = setTimeout(() => {
                showSummaryModal();
            }, 1000);
        }

        function showSummaryModal() {
            clearAllHoles();

            const isNewBest = (typeof saveHighScore === 'function') ? saveHighScore('mole', score) : false;

            document.getElementById('sum-score').innerText = score;
            document.getElementById('sum-record').innerText = isNewBest ? '🎉 新紀錄！' : '';

            document.getElementById('sum-hit-normal').innerText = `×${stats.normalHit}`;
            document.getElementById('sum-hit-armored').innerText = `×${stats.armoredHit}`;
            document.getElementById('sum-miss-normal').innerText = `×${stats.missedNormal}`;
            document.getElementById('sum-miss-armored').innerText = `×${stats.missedArmored}`;
            document.getElementById('sum-police').innerText = `×${stats.policeHit}`;

            document.getElementById('sum-detail').innerHTML =
                `最高等級 <b>Lv.${level}</b> ｜ 最高連擊 <b>${maxCombo} 連擊</b><br>` +
                `進入熱血狀態 <b>${stats.feverCount} 次</b>`;

            const restartBtn = document.getElementById('btn-restart');
            restartBtn.disabled = true;

            const overlay = document.getElementById('summary-overlay');
            overlay.classList.add('show');

            restartEnableTimer = setTimeout(() => {
                restartBtn.disabled = false;
            }, 450);
        }

        function hideSummaryModal() {
            const overlay = document.getElementById('summary-overlay');
            overlay.classList.remove('show');
        }

        function resetHole(hole) {
            hole.active = false;
            hole.type = null;
            hole.hp = 0;
            hole.el.classList.remove('active');
            hole.badgeEl.classList.remove('one-left', 'heal-badge');
            hole.badgeEl.style.display = 'none';
            setTimeout(() => {
                if (!hole.active) {
                    hole.spriteEl.innerText = '';
                }
            }, 130);
        }

        function clearAllHoles() {
            holes.forEach(h => {
                clearTimeout(h.hideTimeout);
                h.active = false;
                h.type = null;
                h.hp = 0;
                h.el.classList.remove('active');
                h.badgeEl.classList.remove('one-left', 'heal-badge');
                h.badgeEl.style.display = 'none';
                h.spriteEl.innerText = '';
            });
        }

        function showFloatTip(parentEl, text, color) {
            const tip = document.createElement('div');
            tip.className = 'float-tip';
            tip.innerText = text;
            tip.style.color = color;
            tip.style.background = 'rgba(0,0,0,0.68)';
            parentEl.appendChild(tip);
            setTimeout(() => tip.remove(), 650);
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('level-display').innerText = `Lv.${level}`;
            document.getElementById('combo-display').innerText = `🔥 ${totalCombo} 連擊`;

            const fullHearts = '❤️'.repeat(lives);
            const emptyHearts = '🖤'.repeat(MAX_LIVES - lives);
            document.getElementById('lives-display').innerText = fullHearts + emptyHearts;

            if (!isFever) {
                updateFeverBar(0);
            }
        }
    </script>
</body>
</html>
