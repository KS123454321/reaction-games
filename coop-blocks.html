                waitNote.classList.remove('hidden');
                waitNote.textContent = '已送出再玩一局請求，等待房主同步新棋盤...';
                setToast('已向房主送出再玩一局請求...', true);
            }
        }

        // 依 isHost 正確對應 host 與 guest 的統計資料，並顯示當局完整設定
        function openGameOver(isNew = false) {
            const reasonEl = document.getElementById('end-reason');
            reasonEl.textContent = state.endReason ? `結束原因：${state.endReason}` : '';

            document.getElementById('final-score').textContent = `最終得分：${state.score} 分`;
            document.getElementById('record-flag').classList.toggle('hidden', !isNew);

            if (state.mode === 'multiplayer') {
                const hostName = state.isHost ? profile.name : state.mate.name;
                const guestName = !state.isHost ? profile.name : state.mate.name;
                const hostStat = state.isHost ? state.stats.local : state.stats.remote;
                const guestStat = !state.isHost ? state.stats.local : state.stats.remote;

                document.getElementById('final-stats').textContent =
                    `🏠 ${hostName} 放 ${hostStat.cells} 格 / 消 ${hostStat.lines} 排；👤 ${guestName} 放 ${guestStat.cells} 格 / 消 ${guestStat.lines} 排。`;
            } else {
                document.getElementById('final-stats').textContent =
                    `累計放置 ${state.stats.local.cells} 格，成功消除 ${state.stats.local.lines} 排。`;
            }

            const modeText = state.mode === 'multiplayer' ? '雙人合作連線' : '單人模式';
            const diffText = (DIFFICULTY_META[state.difficulty] || DIFFICULTY_META.medium).label;
            const timeText = state.timeLimit ? `限時 ${Math.floor(state.timeLimit / 60)} 分鐘` : '不限時（訓練模式）';
            const rotText = state.allowRotate ? '允許旋轉方塊' : '不允許旋轉方塊';

            document.getElementById('final-settings').innerHTML = `
                <div><strong>📋 本局設定：</strong></div>
                <div>• 模式：${modeText}</div>
                <div>• 棋盤大小：${state.boardSize} × ${state.boardSize}</div>
                <div>• 遊戲難度：${diffText}</div>
                <div>• 時間模式：${timeText}</div>
                <div>• 方塊旋轉：${rotText}</div>
            `;

            document.getElementById('gameover-modal').style.display = 'flex';
        }

        function buildBoard() {
            const n = state.boardSize;
            if (builtBoardSize === n) return;
            const el = document.getElementById('board-el');
            el.style.gridTemplateColumns = `repeat(${n}, var(--cell-size, 32px))`;
            el.innerHTML = '';

            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.addEventListener('mouseenter', () => {
                        state.hoverPos = { r, c };
                        drawPreview();
                    });
                    cell.addEventListener('click', () => clickBoardCell(r, c));
                    el.appendChild(cell);
                }
            }

            el.addEventListener('mouseleave', () => {
                state.hoverPos = null;
                clearPreview();
            });
            builtBoardSize = n;
        }

        function renderBoard() {
            buildBoard();
            const n = state.boardSize;
            const aiming = !!(state.armedTool && state.armedTool !== 'reroll');

            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    const cellEl = document.querySelector(`#board-el .cell[data-r="${r}"][data-c="${c}"]`);
                    if (!cellEl) continue;
                    const d = state.board[r] && state.board[r][c];
                    cellEl.classList.remove('filled', 'ok-preview', 'bad-preview', 'aim-cell', 'tool-blast-preview');
                    cellEl.style.backgroundColor = '';
                    cellEl.textContent = '';

                    if (aiming) cellEl.classList.add('aim-cell');
                    if (d && d.color) {
                        cellEl.classList.add('filled');
                        cellEl.style.backgroundColor = d.color;
                        if (d.item && ITEMS[d.item]) cellEl.textContent = ITEMS[d.item].icon;
                    }
                }
            }
            drawPreview();
        }

        function clearPreview() {
            document.querySelectorAll('#board-el .cell').forEach(el => {
                el.classList.remove('ok-preview', 'bad-preview', 'tool-blast-preview');
            });
        }

        function drawPreview() {
            clearPreview();
            if (!state.hoverPos) return;
            const { r: r0, c: c0 } = state.hoverPos;
            const n = state.boardSize;

            if (state.armedTool && ['bomb', 'col', 'row'].includes(state.armedTool)) {
                const coords = [];
                if (state.armedTool === 'bomb') {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = r0 + dr, nc = c0 + dc;
                            if (nr >= 0 && nr < n && nc >= 0 && nc < n) coords.push([nr, nc]);
                        }
                    }
                } else if (state.armedTool === 'col') {
                    for (let nr = 0; nr < n; nr++) coords.push([nr, c0]);
                } else if (state.armedTool === 'row') {
                    for (let nc = 0; nc < n; nc++) coords.push([r0, nc]);
                }
                coords.forEach(([rr, cc]) => {
                    const target = document.querySelector(`#board-el .cell[data-r="${rr}"][data-c="${cc}"]`);
                    if (target) target.classList.add('tool-blast-preview');
                });
                return;
            }

            if (state.pickedSlot === null) return;
            const p = state.hands.local[state.pickedSlot];
            if (!p) return;

            const ok = canFit(p.matrix, r0, c0);
            for (let r = 0; r < p.matrix.length; r++) {
                for (let c = 0; c < p.matrix[r].length; c++) {
                    if (!p.matrix[r][c]) continue;
                    const br = r0 + r, bc = c0 + c;
                    if (br >= 0 && br < n && bc >= 0 && bc < n) {
                        const target = document.querySelector(`#board-el .cell[data-r="${br}"][data-c="${bc}"]`);
                        if (target) target.classList.add(ok ? 'ok-preview' : 'bad-preview');
                    }
                }
            }
        }

        function renderHand() {
            const box = document.getElementById('hand-el');
            box.innerHTML = '';

            state.hands.local.forEach((p, idx) => {
                const slot = document.createElement('div');
                const isEmpty = !p;
                const canPut = p ? canPiecePlaceAnywhere(p) : true;
                const isPicked = state.pickedSlot === idx && !!p;

                slot.className = 'slot'
                    + (isEmpty ? ' empty' : '')
                    + (!isEmpty && !canPut ? ' unplaceable' : '')
                    + (isPicked ? ' picked' : '');

                if (p) {
                    const cols = p.matrix[0].length;
                    const mini = document.createElement('div');
                    mini.className = 'mini';
                    mini.style.gridTemplateColumns = `repeat(${cols}, 14px)`;

                    p.matrix.forEach(row => {
                        row.forEach(cell => {
                            const sq = document.createElement('div');
                            sq.className = 'mini-sq';
                            if (cell) {
                                sq.style.backgroundColor = profile.color;
                                if (cell.item) sq.textContent = ITEMS[cell.item].icon;
                            } else {
                                sq.style.background = 'transparent';
                            }
                            mini.appendChild(sq);
                        });
                    });
                    slot.appendChild(mini);

                    slot.addEventListener('click', () => {
                        if (!state.playing || state.over) return;
                        state.armedTool = null;
                        state.pickedSlot = state.pickedSlot === idx ? null : idx;
                        renderItems();
                        renderHand();
                        renderBoard();
                        updateRotateButtonUI();
                    });

                    slot.addEventListener('touchstart', e => {
                        if (!state.playing || state.over) return;
                        e.preventDefault();
                        state.armedTool = null;
                        state.pickedSlot = idx;
                        renderItems();
                        renderHand();
                        renderBoard();
                        updateRotateButtonUI();
                        const t = e.touches[0];
                        updateTouchGhostAndAim(p, t.clientX, t.clientY);
                    }, { passive: false });

                    slot.addEventListener('touchmove', e => {
                        if (!state.playing || state.over || state.pickedSlot !== idx) return;
                        e.preventDefault();
                        const t = e.touches[0];
                        updateTouchGhostAndAim(p, t.clientX, t.clientY);
                    }, { passive: false });

                    slot.addEventListener('touchend', e => {
                        if (!state.playing || state.over || state.pickedSlot !== idx) return;
                        e.preventDefault();
                        hideGhost();
                        if (state.hoverPos) {
                            tryPlace(idx, state.hoverPos.r, state.hoverPos.c);
                        }
                        state.hoverPos = null;
                        clearPreview();
                    }, { passive: false });
                }

                box.appendChild(slot);
            });

            updateRotateButtonUI();
        }

        function updateTouchGhostAndAim(piece, touchX, touchY) {
            const g = document.getElementById('ghost-el');
            const cellPx = computeCellSize(state.boardSize);
            const step = cellPx + 2;
            const cols = piece.matrix[0].length;
            const rows = piece.matrix.length;
            const totalW = cols * step - 2;
            const totalH = rows * step - 2;
            const offY = profile.offset ? GAME_CONFIG.TOUCH_OFFSET_Y : 0;

            const topLeftX = touchX - totalW / 2;
            const topLeftY = touchY - totalH / 2 - offY;

            g.style.display = 'grid';
            g.style.gridTemplateColumns = `repeat(${cols}, ${cellPx}px)`;
            g.style.gap = '2px';
            g.style.left = topLeftX + 'px';
            g.style.top = topLeftY + 'px';
            g.innerHTML = '';

            piece.matrix.forEach(row => {
                row.forEach(cell => {
                    const d = document.createElement('div');
                    d.style.width = cellPx + 'px';
                    d.style.height = cellPx + 'px';
                    d.style.borderRadius = '4px';
                    d.style.display = 'flex';
                    d.style.alignItems = 'center';
                    d.style.justifyContent = 'center';
                    d.style.fontSize = Math.max(10, Math.floor(cellPx * 0.5)) + 'px';
                    d.style.color = '#fff';
                    if (cell) {
                        d.style.backgroundColor = profile.color;
                        if (cell.item) d.textContent = ITEMS[cell.item].icon;
                    }
                    g.appendChild(d);
                });
            });

            const anchorProbeX = topLeftX + cellPx / 2;
            const anchorProbeY = topLeftY + cellPx / 2;
            const hit = document.elementFromPoint(anchorProbeX, anchorProbeY);
            const cell = hit?.closest('#board-el .cell');
            state.hoverPos = cell
                ? { r: parseInt(cell.dataset.r, 10), c: parseInt(cell.dataset.c, 10) }
                : null;
            drawPreview();
        }

        function hideGhost() {
            const g = document.getElementById('ghost-el');
            g.style.display = 'none';
            g.innerHTML = '';
        }

        function renderItems() {
            const box = document.getElementById('items-el');
            box.innerHTML = '';
            Object.entries(ITEMS).forEach(([key, meta]) => {
                const cnt = state.items.local[key] || 0;
                const armed = state.armedTool === key;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'mini-item-btn' + (armed ? ' armed' : '');
                btn.disabled = cnt <= 0 || !state.playing || state.over;
                btn.title = meta.name;
                btn.innerHTML = `<span>${meta.icon}</span><span>×${cnt}</span>`;
                btn.addEventListener('click', () => clickTool(key));
                box.appendChild(btn);
            });
            document.getElementById('btn-cancel-item').classList.toggle('hidden', !state.armedTool);
        }

        function updateHud() {
            document.getElementById('hud-score').textContent = state.score;
            document.getElementById('hud-best').textContent = localStorage.getItem('best_coop_blocks') || 0;
        }

        window.addEventListener('DOMContentLoaded', initLobby);
    </script>
</body>
